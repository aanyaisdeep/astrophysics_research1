
name: Planck CMB Temperature Maps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-maps:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download Planck data
        run: python download_data.py

      - name: Generate CMB maps
        run: python plot_cmb.py

      - name: Upload generated maps
        uses: actions/upload-artifact@v4
        with:
          name: planck-cmb-maps
          path: outputs/*.png
          if-no-files-found: error
          retention-days: 7
